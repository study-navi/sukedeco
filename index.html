<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SukeDeco｜すけでこ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <div class="brand">SukeDeco</div>
        <p>予定を入力するだけ。AIがデザイン。</p>
      </div>
      <button id="resetBtn" class="ghost">リセット</button>
    </header>

    <main class="shell">
      <section class="panel compactPanel">
        <div class="stepTitle"><span>1</span>予定入力</div>
        <label class="fieldLabel">メインタイトル</label>
        <input id="mainTitle" class="input" value="今週の配信予定" placeholder="例：今週の配信予定" />

        <div class="quickAdd">
          <button id="pickDateBtn" class="inputBtn">📅 日付</button>
          <button id="pickTimeBtn" class="inputBtn">⏰ 時間</button>
          <input id="eventTitle" class="input grow" placeholder="予定タイトル" />
          <button id="addEventBtn" class="primary small">＋</button>
        </div>
        <div id="dateTimeText" class="hint">日付と時間を選んでください</div>

        <div id="eventsList" class="eventsList"></div>

        <div class="stepTitle"><span>2</span>AIで作成</div>
        <button id="generateBtn" class="aiBtn">✨ スケジュールを作成</button>
        <div id="aiMessage" class="aiMessage">予定件数・雰囲気・イラスト有無から自動で表を作ります。</div>

        <details class="detailsBox">
          <summary>こだわり設定</summary>
          <div class="grid2">
            <label>雰囲気
              <select id="mood" class="input"><option>おまかせ</option><option>ポップ</option><option>クール</option><option>ゲーム</option><option>シンプル</option><option>ゆめかわ</option><option>和風</option><option>宇宙</option></select>
            </label>
            <label>メイン色
              <input id="mainColor" type="color" value="#7c5cff" class="colorInput" />
            </label>
            <label>柄
              <select id="pattern" class="input"><option>おまかせ</option><option>なし</option><option>星</option><option>水玉</option><option>グリッド</option><option>ストライプ</option><option>ハート</option></select>
            </label>
            <label>文字サイズ
              <input id="fontScale" type="range" min="80" max="120" value="100" />
            </label>
          </div>
        </details>

        <details class="detailsBox">
          <summary>イラスト編集</summary>
          <input id="illustInput" type="file" accept="image/*" class="fileInput" />
          <div class="grid2 controls">
            <label>サイズ<input id="illustScale" type="range" min="30" max="220" value="100" /></label>
            <label>回転<input id="illustRotate" type="range" min="-30" max="30" value="0" /></label>
            <label>透明度<input id="illustOpacity" type="range" min="20" max="100" value="100" /></label>
            <label>透過強さ<input id="removeStrength" type="range" min="5" max="80" value="28" /></label>
          </div>
          <div class="buttonRow">
            <button id="removeWhiteBtn" class="soft">白背景を透過</button>
            <button id="removeClickColorBtn" class="soft">クリック色を透過</button>
            <button id="deleteIllustBtn" class="danger">削除</button>
          </div>
          <p class="hint">イラストは完成画像上でドラッグ移動できます。クリック色透過は画像を押して色を選びます。</p>
        </details>
      </section>

      <section class="previewWrap">
        <div class="phonePreview">
          <div id="canvas" class="scheduleCanvas">
            <div id="patternLayer" class="patternLayer"></div>
            <div class="canvasContent">
              <h1 id="canvasTitle">今週の配信予定</h1>
              <div id="scheduleArea" class="scheduleArea empty">予定を追加して「スケジュールを作成」を押してください</div>
            </div>
            <img id="illust" class="illust hidden" alt="イラスト" draggable="false" />
            <div id="watermark" class="watermark">Made with SukeDeco</div>
          </div>
        </div>

        <section class="panel savePanel">
          <div class="stepTitle"><span>3</span>保存</div>
          <div class="buttonRow">
            <button id="savePngBtn" class="primary">PNG保存</button>
            <button id="draftBtn" class="soft">下書き保存</button>
          </div>
          <label class="check"><input id="watermarkToggle" type="checkbox" checked /> Made with SukeDecoを表示</label>
        </section>
      </section>
    </main>
  </div>

  <dialog id="dateDialog" class="pickerDialog">
    <div class="dialogHead"><b>日付を選択</b><button class="ghost" data-close="dateDialog">閉じる</button></div>
    <input id="datePicker" type="date" class="input" />
    <button id="dateOkBtn" class="primary full">決定</button>
  </dialog>

  <dialog id="timeDialog" class="pickerDialog">
    <div class="dialogHead"><b>時間を選択</b><button class="ghost" data-close="timeDialog">閉じる</button></div>
    <div class="timeBox">
      <label>時 <input id="hourRange" type="range" min="0" max="23" value="20" /></label>
      <div id="hourView" class="bigNum">20</div>
      <label>分 <input id="minuteRange" type="range" min="0" max="55" step="5" value="0" /></label>
      <div id="minuteView" class="bigNum">00</div>
    </div>
    <button id="timeOkBtn" class="primary full">決定</button>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
