<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>SukeDeco｜すけでこ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <div class="brand">SukeDeco</div>
        <div class="sub">予定を入力するだけ。AI風に表を作成。</div>
      </div>
      <button id="resetBtn" class="ghost">初期化</button>
    </header>

    <main class="main">
      <section class="panel inputPanel">
        <h2>① 予定入力</h2>
        <label class="field full">
          <span>メインタイトル</span>
          <input id="mainTitle" type="text" value="今週の配信予定" placeholder="例：今週の配信予定" />
        </label>

        <div class="formGrid">
          <label class="field"><span>日付</span><input id="dateInput" type="date" /></label>
          <label class="field"><span>時間</span><input id="timeInput" type="time" value="20:00" /></label>
          <label class="field full"><span>タイトル</span><input id="titleInput" type="text" placeholder="例：雑談配信" /></label>
          <label class="field full"><span>右側メモ</span><input id="noteInput" type="text" placeholder="例：初見さん歓迎 / コラボ / 参加型" /></label>
        </div>

        <div class="btnRow">
          <button id="addBtn" class="primary">＋ 予定を追加</button>
          <button id="makeBtn" class="accent">✨ スケジュールを作成</button>
        </div>

        <div class="scheduleListWrap">
          <div class="miniTitle">入力した予定</div>
          <div id="scheduleList" class="scheduleList empty">まだ予定がありません</div>
        </div>

        <details class="compactBox">
          <summary>こだわり設定</summary>
          <div class="settingsGrid">
            <label class="field"><span>雰囲気</span><select id="moodSelect"><option value="pop">ポップ</option><option value="cool">クール</option><option value="game">ゲーム</option><option value="simple">シンプル</option><option value="night">夜</option><option value="cafe">カフェ</option></select></label>
            <label class="field"><span>メイン色</span><input id="mainColor" type="color" value="#5b7cfa" /></label>
            <label class="field"><span>アクセント</span><input id="accentColor" type="color" value="#ff7aa8" /></label>
            <label class="field"><span>柄</span><select id="patternSelect"><option value="auto">AIにおまかせ</option><option value="none">なし</option><option value="dots">水玉</option><option value="stars">星</option><option value="grid">グリッド</option><option value="stripe">ストライプ</option></select></label>
          </div>
        </details>

        <details class="compactBox">
          <summary>イラスト挿入・編集</summary>
          <label class="filePick"><input id="imageInput" type="file" accept="image/*" />イラストを選ぶ</label>
          <div class="settingsGrid">
            <label class="field"><span>サイズ</span><input id="imgSize" type="range" min="40" max="220" value="115" /></label>
            <label class="field"><span>左右位置</span><input id="imgX" type="range" min="0" max="100" value="78" /></label>
            <label class="field"><span>上下位置</span><input id="imgY" type="range" min="0" max="100" value="50" /></label>
            <label class="field"><span>透明度</span><input id="imgOpacity" type="range" min="20" max="100" value="100" /></label>
          </div>
          <div class="btnRow small"><button id="flipBtn" class="ghost">左右反転</button><button id="removeImgBtn" class="ghost danger">イラスト削除</button></div>
        </details>
      </section>

      <section class="panel previewPanel">
        <div class="previewHead">
          <h2>② プレビュー</h2>
          <div id="layoutHint" class="hint">予定を追加して作成してください</div>
        </div>
        <div id="canvas" class="canvas pattern-dots mood-pop">
          <div class="watermark">Made with SukeDeco</div>
          <div id="illustrationLayer" class="illustrationLayer hidden"><img id="illustImg" alt="挿入イラスト" /></div>
          <div class="canvasInner">
            <div id="canvasTitle" class="canvasTitle">今週の配信予定</div>
            <div id="cardsArea" class="cardsArea layout-empty"><div class="emptyPreview">予定を追加するとここに表ができます</div></div>
          </div>
        </div>
        <div class="btnRow exportRow"><button id="downloadBtn" class="primary">PNG保存</button></div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
