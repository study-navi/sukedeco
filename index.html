<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SukeDeco｜すけでこ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="appShell">
    <header class="topbar">
      <div>
        <div class="logo">SukeDeco</div>
        <div class="subLogo">予定を入力するだけ。AIがデザイン。</div>
      </div>
      <button class="ghostBtn" id="resetBtn">白紙</button>
    </header>

    <main class="mainGrid">
      <section class="panel controlPanel">
        <div class="stepPill">STEP 1</div>
        <h1>予定を入れる</h1>
        <p class="lead">日付はカレンダー、時間はスライドで選べます。</p>

        <div class="formCard">
          <label>日付</label>
          <input type="date" id="dateInput" />
          <label>時間</label>
          <div class="timeRow"><span id="timeText">20:00</span><input type="range" id="timeSlider" min="0" max="95" value="80" /></div>
          <label>内容</label>
          <input type="text" id="titleInput" placeholder="例：雑談配信 / ゲーム / コラボ" />
          <label>ジャンル</label>
          <select id="genreInput">
            <option>雑談</option><option>ゲーム</option><option>コラボ</option><option>歌</option><option>作業</option><option>イベント</option><option>お知らせ</option>
          </select>
          <button class="primaryBtn" id="addScheduleBtn">＋ 予定を追加</button>
        </div>

        <div class="scheduleList" id="scheduleList"></div>

        <div class="stepPill">STEP 2</div>
        <h2>AIに伝える</h2>
        <div class="chipGroup" id="moodChips">
          <button data-mood="pop" class="chip active">ポップ</button>
          <button data-mood="cool" class="chip">クール</button>
          <button data-mood="game" class="chip">ゲーム</button>
          <button data-mood="cute" class="chip">かわいい</button>
          <button data-mood="summer" class="chip">夏</button>
          <button data-mood="space" class="chip">宇宙</button>
          <button data-mood="cafe" class="chip">カフェ</button>
          <button data-mood="japan" class="chip">和風</button>
        </div>

        <div class="colorGrid">
          <label>メイン色<input type="color" id="mainColor" value="#4f7cff"></label>
          <label>アクセント<input type="color" id="accentColor" value="#ff7ab6"></label>
        </div>
        <textarea id="promptInput" placeholder="例：男性でも使いやすい、夜っぽく、近未来、落ち着いた感じ"></textarea>

        <div class="illustBox">
          <label class="uploadBtn">🖼 イラストを挿入<input type="file" id="illustInput" accept="image/png,image/jpeg,image/webp" hidden></label>
          <div class="miniTools" id="illustTools">
            <button id="removeWhiteBtn">白背景を透過</button>
            <button id="pickTransparentBtn">クリック色を透過</button>
            <button id="flipBtn">左右反転</button>
            <button id="deleteIllustBtn">削除</button>
            <label>透過強さ<input type="range" id="threshold" min="8" max="120" value="38"></label>
            <label>境界ぼかし<input type="range" id="softness" min="0" max="50" value="10"></label>
            <label>大きさ<input type="range" id="illustSize" min="20" max="180" value="70"></label>
            <label>回転<input type="range" id="illustRotate" min="-30" max="30" value="0"></label>
          </div>
        </div>

        <button class="aiBtn" id="generateBtn">✨ AIでスケジュール表を作成</button>
        <div class="aiLog" id="aiLog"></div>
      </section>

      <section class="panel previewPanel">
        <div class="previewHeader">
          <div>
            <div class="stepPill">STEP 3</div>
            <h2>AI候補</h2>
          </div>
          <button class="ghostBtn" id="shuffleBtn">🎲 別案</button>
        </div>
        <div class="candidateStrip" id="candidateStrip"></div>

        <div class="previewWrap">
          <div class="canvas" id="canvas">
            <div class="bgPattern" id="bgPattern"></div>
            <div class="watermark" id="watermark">Made with SukeDeco</div>
            <img id="illust" class="illust" alt="" />
            <div class="scheduleArt" id="scheduleArt"></div>
          </div>
        </div>

        <div class="editPanel">
          <div class="stepPill">STEP 4</div>
          <h2>微調整</h2>
          <div class="quickGrid">
            <button id="applyPatternBtn">柄を変える</button>
            <button id="compactBtn">文字を小さく</button>
            <button id="brightBtn">明るく</button>
            <button id="darkBtn">暗く</button>
          </div>
          <label class="check"><input type="checkbox" id="wmCheck" checked> 透かしを表示</label>
          <button class="primaryBtn" id="savePngBtn">PNG保存</button>
        </div>
      </section>
    </main>
  </div>
  <canvas id="workCanvas" hidden></canvas>
  <script src="app.js"></script>
</body>
</html>
