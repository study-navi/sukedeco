<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SukeDeco｜すけでこ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <div class="brand">SukeDeco</div>
        <div class="tagline">予定を入力するだけ。AIがデザイン。</div>
      </div>
      <button id="resetBtn" class="softBtn">白紙</button>
    </header>

    <main class="workspace">
      <section class="panel controls">
        <div class="sectionHead"><span>STEP 1</span><h1>予定を入れる</h1></div>
        <p class="hint">日付はカレンダー、時間はスライドで選べます。</p>

        <div class="inputCard">
          <div class="twoCols">
            <button class="pickerBtn" id="openCalendarBtn"><small>日付</small><b id="dateText">日付を選択</b></button>
            <button class="pickerBtn" id="openTimeBtn"><small>時間</small><b id="timeText">20:00</b></button>
          </div>
          <label class="fieldLabel">内容</label>
          <input id="titleInput" type="text" placeholder="例：雑談配信 / ゲーム / コラボ" />
          <label class="fieldLabel">ジャンル</label>
          <select id="genreInput">
            <option>雑談</option><option>ゲーム</option><option>コラボ</option><option>歌</option><option>作業</option><option>イベント</option><option>お知らせ</option><option>記念</option>
          </select>
          <button id="addScheduleBtn" class="primaryBtn">＋ 予定を追加</button>
        </div>

        <div id="scheduleList" class="scheduleList"></div>

        <div class="sectionHead"><span>STEP 2</span><h2>AIに伝える</h2></div>
        <div id="moodChips" class="chips">
          <button class="chip active" data-mood="pop">ポップ</button>
          <button class="chip" data-mood="cool">クール</button>
          <button class="chip" data-mood="game">ゲーム</button>
          <button class="chip" data-mood="minimal">ミニマル</button>
          <button class="chip" data-mood="cute">かわいい</button>
          <button class="chip" data-mood="neon">ネオン</button>
          <button class="chip" data-mood="summer">夏</button>
          <button class="chip" data-mood="space">宇宙</button>
          <button class="chip" data-mood="cafe">カフェ</button>
          <button class="chip" data-mood="japan">和風</button>
          <button class="chip" data-mood="mono">モノトーン</button>
          <button class="chip" data-mood="retro">レトロ</button>
        </div>

        <div class="twoCols colors">
          <label>メイン色<input id="mainColor" type="color" value="#4f7cff" /></label>
          <label>アクセント<input id="accentColor" type="color" value="#ff7ab6" /></label>
        </div>
        <textarea id="promptInput" placeholder="例：男性でも使いやすい、夜っぽく、近未来、落ち着いた感じ"></textarea>

        <div class="illustPanel">
          <label class="uploadBtn">🖼 イラストを挿入<input id="illustInput" type="file" accept="image/png,image/jpeg,image/webp" hidden></label>
          <div id="illustTools" class="toolGrid hidden">
            <button id="autoRemoveBgBtn">🪄 背景を消す</button>
            <button id="whiteRemoveBtn">白背景透過</button>
            <button id="pickColorBtn">クリック色透過</button>
            <button id="flipBtn">左右反転</button>
            <button id="deleteIllustBtn" class="danger">削除</button>
            <label>透過強さ<input id="threshold" type="range" min="10" max="160" value="60" /></label>
            <label>境界ぼかし<input id="softness" type="range" min="0" max="80" value="16" /></label>
            <label>大きさ<input id="illustSize" type="range" min="25" max="170" value="82" /></label>
            <label>回転<input id="illustRotate" type="range" min="-35" max="35" value="0" /></label>
          </div>
        </div>

        <button id="generateBtn" class="aiBtn">✨ AIでスケジュール表を作成</button>
        <div id="aiLog" class="aiLog">予定を入れてAI作成を押してください。</div>
      </section>

      <section class="panel previewPanel">
        <div class="previewHeader">
          <div class="sectionHead"><span>STEP 3</span><h2>AI候補</h2></div>
          <button id="shuffleBtn" class="softBtn">🎲 別案</button>
        </div>
        <div id="candidateStrip" class="candidateStrip"></div>

        <div class="canvasWrap">
          <div id="canvas" class="canvas">
            <div id="patternLayer" class="patternLayer"></div>
            <img id="illust" class="illust" alt="" />
            <div id="scheduleArt" class="scheduleArt"></div>
            <div id="watermark" class="watermark">Made with SukeDeco</div>
          </div>
        </div>

        <div class="editPanel">
          <div class="sectionHead"><span>STEP 4</span><h2>微調整</h2></div>
          <div class="quickGrid">
            <button id="nextPatternBtn">柄を変える</button>
            <button id="autoFitBtn">予定を収める</button>
            <button id="brightBtn">明るく</button>
            <button id="darkBtn">暗く</button>
          </div>
          <label class="check"><input id="wmCheck" type="checkbox" checked> 透かしを表示</label>
          <button id="savePngBtn" class="primaryBtn">PNG保存</button>
        </div>
      </section>
    </main>
  </div>

  <div id="calendarModal" class="modal hidden">
    <div class="sheet">
      <div class="sheetTop"><button id="prevMonth">‹</button><b id="monthLabel"></b><button id="nextMonth">›</button></div>
      <div class="weekRow"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div>
      <div id="calendarGrid" class="calendarGrid"></div>
      <button class="softBtn full" id="closeCalendar">閉じる</button>
    </div>
  </div>

  <div id="timeModal" class="modal hidden">
    <div class="sheet">
      <h2>時間を選択</h2>
      <div class="bigTime" id="bigTime">20:00</div>
      <label>時<input id="hourRange" type="range" min="0" max="23" value="20" /></label>
      <label>分<input id="minuteRange" type="range" min="0" max="11" value="0" /></label>
      <div class="minuteHint">5分刻みで選択できます</div>
      <button class="primaryBtn full" id="applyTime">決定</button>
    </div>
  </div>

  <canvas id="workCanvas" hidden></canvas>
  <script src="app.js"></script>
</body>
</html>
