<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>すけでこ｜SukeDeco AI Schedule</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="logo">SukeDeco</div>
        <p class="tagline">予定を入れるだけ。スケジュール表をかんたん作成。</p>
      </div>
      <button id="saveDraftBtn" class="ghost-btn">下書き保存</button>
    </header>

    <main class="main-grid">
      <section class="panel input-panel">
        <div class="section-title">
          <span>1</span>
          <h2>予定を入力</h2>
        </div>
        <p class="hint">日付・時間・内容を入れて「AI風に作成」を押すだけ。</p>

        <div class="quick-row">
          <button id="sampleBtn" class="mini-btn">サンプル入力</button>
          <button id="clearBtn" class="mini-btn danger">予定をクリア</button>
        </div>

        <div id="scheduleList" class="schedule-list"></div>
        <button id="addScheduleBtn" class="add-btn">＋ 予定を追加</button>

        <div class="section-title small">
          <span>2</span>
          <h2>雰囲気を選ぶ</h2>
        </div>

        <div class="control-group">
          <label>作りたい雰囲気</label>
          <select id="moodSelect">
            <option value="auto">AIにおまかせ</option>
            <option value="cute">かわいい</option>
            <option value="simple">シンプル</option>
            <option value="neon">ネオン</option>
            <option value="game">ゲーム</option>
            <option value="night">夜配信</option>
            <option value="cafe">カフェ</option>
            <option value="summer">夏</option>
          </select>
        </div>

        <div class="control-group">
          <label>表の見せ方</label>
          <select id="layoutSelect">
            <option value="smart">AIにおまかせ</option>
            <option value="cards">カード</option>
            <option value="timeline">タイムテーブル</option>
            <option value="compact">コンパクト</option>
            <option value="poster">ポスター</option>
          </select>
        </div>

        <div class="control-row">
          <div class="control-group half">
            <label>メイン色</label>
            <input id="mainColor" type="color" value="#8b5cf6" />
          </div>
          <div class="control-group half">
            <label>サブ色</label>
            <input id="subColor" type="color" value="#38bdf8" />
          </div>
        </div>

        <div class="control-group">
          <label>文字の大きさ</label>
          <input id="fontSizeRange" type="range" min="70" max="130" value="100" />
        </div>

        <div class="control-group checkline">
          <input id="watermarkCheck" type="checkbox" checked />
          <label for="watermarkCheck">Made with SukeDeco を入れる</label>
        </div>

        <button id="aiCreateBtn" class="ai-btn">✨ AI風にスケジュール表を作成</button>
      </section>

      <section class="preview-area">
        <div class="preview-toolbar panel">
          <div>
            <strong>完成プレビュー</strong>
            <p id="aiComment">予定を入れると、見やすい表に自動で整えます。</p>
          </div>
          <div class="export-buttons">
            <button id="squareBtn">X正方形</button>
            <button id="verticalBtn">縦長</button>
            <button id="storyBtn">ストーリー</button>
          </div>
        </div>

        <div class="canvas-wrap">
          <div id="exportCanvas" class="schedule-canvas size-square mood-cute layout-cards">
            <div id="bgLayer" class="bg-layer"></div>
            <div class="canvas-inner">
              <div class="canvas-heading">
                <div class="label-pill">SCHEDULE</div>
                <h1 id="canvasTitle">今週の配信予定</h1>
                <p id="canvasSub">予定を入力して、AI風に自動作成</p>
              </div>
              <div id="renderedSchedule" class="rendered-schedule">
                <div class="empty-state">＋ 予定を追加して<br>スケジュール表を作ろう</div>
              </div>
            </div>
            <div id="watermark" class="watermark">Made with SukeDeco</div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
